# Resources are pinned so the ladder's steps compare fairly: each API instance gets 1 CPU, Postgres
# 2 CPUs and 2 GB, Redis 1 CPU. k6 runs outside these limits.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200"]
    ports:
      - "5434:5432"
    volumes:
      - db:/var/lib/postgresql
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    cpus: 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  db:
