# Resources are pinned so the ladder's steps compare fairly: each API instance gets 1 CPU, Postgres
# 2 CPUs and 2 GB, Redis 1 CPU, nginx 1 CPU. k6 runs outside these limits.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200"]
    ports:
      - "5434:5432"
    volumes:
      - db:/var/lib/postgresql
    cpus: 2
    mem_limit: 2g
    # pg_isready opens a session, and Postgres counts it against the database it names. Checking the
    # "postgres" database keeps these out of the tracker database's counters, which the ladder reads.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d postgres"]
      start_period: 60s
      start_interval: 1s
      interval: 30s
      timeout: 2s
      retries: 3

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    cpus: 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: .
    environment:
      Tracker__Database: Host=db;Username=tracker;Password=tracker;Database=tracker
      Tracker__Redis: redis:6379
      # Set per step by scripts/ladder.py.
      Tracker__Pooling: ${TRACKER_POOLING:-false}
      Tracker__MaxPoolSize: ${TRACKER_MAX_POOL:-20}
      Tracker__Cache: ${TRACKER_CACHE:-false}
      Tracker__CacheTtlSeconds: ${TRACKER_CACHE_TTL:-60}
      Tracker__CacheInvalidation: ${TRACKER_CACHE_INVALIDATION:-true}
      Tracker__Coalescing: ${TRACKER_COALESCING:-false}
      Tracker__CacheTtlJitter: ${TRACKER_CACHE_TTL_JITTER:-0}
      Logging__LogLevel__Default: Warning
    # No host port: step 5 runs three of these. Reach them through nginx on 8090.
    cpus: 1
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image has no curl, so the health check is plain bash, as in Week 1.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      # Every 2 s while starting, then every 30 s: with pooling off, each check opens a database
      # connection, and frequent checks would inflate the connections the ladder counts per request.
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Step 5's load balancer. Always up, so localhost:8090 reaches the API at every step; the ladder
  # sends load straight to the API before step 5, so the earlier steps don't pay for the extra hop.
  nginx:
    image: nginx:1.28.0-alpine
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:80"
    cpus: 1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 2s
      retries: 3

  # The load generator. Only runs on demand: docker compose run --rm k6 run /load/workload.js
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    environment:
      TARGET: ${TARGET:-http://api:8080}
      SHIPMENTS: ${SHIPMENTS:-1000000}
      CUSTOMERS: ${CUSTOMERS:-100000}
    volumes:
      - ./load:/load:ro

volumes:
  db:
