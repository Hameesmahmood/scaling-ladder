# Step 5: round-robin over every API instance. Docker's DNS returns one address per instance of the
# "api" service; "resolve" (open source since nginx 1.27.3) re-reads it every 2 s, so instances
# that stop drop out and new ones join without a reload.
worker_processes 1;

events {
    worker_connections 8192;
}

http {
    access_log off;
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream api {
        zone api 64k;
        # One failure takes an instance out of rotation for 2 s, then one request tries it again.
        server api:8080 resolve max_fails=1 fail_timeout=2s;
        # Reuse connections to the instances instead of opening one per request.
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            # A request that fails on one instance (refused, reset, timed out, or a 502 or 503) is
            # retried on another. Nginx never retries a POST once it has been sent, because it isn't
            # idempotent: recording the event twice would be worse than failing.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }
    }
}
